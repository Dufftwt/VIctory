# Scratch workflow on the fork only, never part of a PR: builds and tests on Windows.
name: scratch windows test
on:
  push:
    branches: ["ci-*", "fix/*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p victory-loader --all-targets
      - name: Demo report line
        run: cargo test -p victory-loader --lib scratch_demo -- --nocapture
      - name: Test
        run: cargo test -p victory-loader --no-fail-fast -- --test-threads=1
