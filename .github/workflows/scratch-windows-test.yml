# Scratch workflow on the fork only, never part of a PR: builds and tests on Windows.
name: scratch windows test
on:
  push:
    branches: ["ci-*", "fix/*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --exclude victory-shader
      - name: Test
        run: cargo test -p victory-gpu --lib --no-fail-fast -- --test-threads=1 device::tests
